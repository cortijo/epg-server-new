services:
  epg-stream:
    image: epgserver:v1.11.0
    container_name: epg-stream
    network_mode: host
    restart: unless-stopped
    environment:
      # Obrigatórios somente para criar o primeiro administrador em volume vazio.
      EPG_ADMIN_USER: ${EPG_ADMIN_USER:-}
      EPG_ADMIN_PASSWORD: ${EPG_ADMIN_PASSWORD:-}
      EPG_HTTP_PORT: ${EPG_HTTP_PORT:-9100}
      EPG_PUBLIC_BASE_URL: ${EPG_PUBLIC_BASE_URL:-}
      EPG_LICENSE_SERVER_URL: ${EPG_LICENSE_SERVER_URL:-http://127.0.0.1:9200}
      EPG_LICENSE_KEY_FILE: /license/license.key
      EPG_LICENSE_INSTALLATION_ID: ${EPG_LICENSE_INSTALLATION_ID:-}
      TZ: America/Sao_Paulo
    volumes:
      - /srv/epg-stream:/data
      - /srv/epg-license-client:/license
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
